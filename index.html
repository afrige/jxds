<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afrige</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="profile-card">
        <img src="pfp.png" alt="Profile Picture" class="pfp">

        <h1>afrige</h1>

        <p class="bio">
            Independent developer focused on software development,
            web technologies, and building practical digital experiences.
            Interested in open-source development and clean design.
        </p>

        <div class="hosting-timer">
            <span id="timer">00:00:00</span>
        </div>
    </main>

    <script>
        const hostingStart = new Date("2026-11-05T00:00:00").getTime();

        function updateTimer() {
            const elapsed = Math.max(
                0,
                Math.floor((Date.now() - hostingStart) / 1000)
            );

            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;

            document.getElementById("timer").textContent =
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>

</body>
</html>
